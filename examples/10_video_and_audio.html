
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Video and Audio</title>

  <!-- A-Frame and 8th Wall Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script async src="../engine/xr.js"></script>

  <!-- 
    这段脚本用来配置图像目标。
    它告诉 8th Wall 引擎要寻找哪一张图片。
    这是从您之前的版本中复制过来的，以确保它能和您的项目正常工作。
  -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [{
          name: "my-poster",
          type: "PLANAR",
          imagePath: "../assets/Targets/Under_portrait.png",
          properties: {
            left: 0, top: 0,
            width: 830, height: 830,
            originalWidth: 830, originalHeight: 830,
            isRotated: false
          }
        }]
      })
    }
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded)
  </script>
</head>

<body>
  <a-scene
    xrweb
    xrextras-loading
    xrextras-runtime-error
    xrextras-gesture-detector>

    <!-- 
      <a-assets> 是预加载所有媒体（视频、图片、音频、3D模型）的最佳位置。
    -->
    <a-assets>
      <!-- 
        视频:
        - 'id' 用于在后面引用这个视频。
        - 'loop' 让视频循环播放。
        - 'muted' 对于在手机浏览器上实现自动播放非常重要。
        - 'playsinline' 帮助视频在iOS上直接在页面内播放。
        - 提醒：视频文件必须是 H.264 编码才能在网页上可靠地工作。
          如果屏幕仍然是黑色的，那很可能就是您的视频文件有问题。
      -->
      <video
        id="my-video"
        src="../assets/video.mp4"
        loop
        muted
        playsinline
        crossorigin="anonymous">
      </video>

      <!-- 
        音频:
        - 'id' 用于在后面引用这个音频。
      -->
      <audio
        id="my-audio"
        src="../assets/634332__josefpres__bass-loops-077-with-drums-long-loop-120-bpm.mp3"
        loop
        crossorigin="anonymous">
      </audio>
    </a-assets>

    <!-- 设置一个基础的相机 -->
    <a-camera></a-camera>

    <!-- 
      这是图像目标。
      - 'name' 必须与您在上面脚本中配置的名称（"my-poster"）匹配。
      - 'play-on-scan' 是一个播放媒体的简单方法。我们告诉它
        当目标被发现时我们想播放的视频和音频的id。当目标丢失时，
        它也会自动暂停它们。
    -->
    <xrextras-named-image-target name="my-poster" play-on-scan="video: #my-video; audio: #my-audio">
      <!-- 
        这是视频将要显示的平面。
        - 'src' 指向我们在 assets 中定义的视频的id。
        - 'width' 和 'height' 应该与您视频的宽高比匹配。
      -->
      <a-video
        src="#my-video"
        width="1.6"
        height="0.9"
        position="0 0.5 0">
      </a-video>
    </xrextras-named-image-target>

  </a-scene>
</body>
</html>
