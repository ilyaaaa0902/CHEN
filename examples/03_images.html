<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>03 — Tarot Card Draw Effect</title>

  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <script async src="../engine/xr.js" data-preload-chunks="slam"></script>

  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData: [{
          name: "my-poster",
          type: "PLANAR",
          imagePath: "../assets/Targets/Under_portrait.png",
          properties: {
            left: 0,
            top: 0,
            width: 830,
            height: 830,
            originalWidth: 830,
            originalHeight: 830,
            isRotated: false
          }
        }]
      });
    };

    window.XR8 ? onxrloaded() : window.addEventListener("xrloaded", onxrloaded);
  </script>
</head>

<body>

<a-scene
  xrextras-gesture-detector
  xrextras-almost-there
  xrextras-loading
  xrextras-runtime-error
  xrweb="disableWorldTracking: true">

  <a-assets>
    <img id="card1" src="../assets/1.png">
    <img id="card2" src="../assets/2.png">
    <img id="card3" src="../assets/3.png">
    <img id="card4" src="../assets/4.png">
    <img id="card5" src="../assets/5.png">
    <img id="card6" src="../assets/6.png">
    <img id="card7" src="../assets/7.png">
    <img id="card8" src="../assets/8.png">
    <img id="card9" src="../assets/9.png">
    <img id="card10" src="../assets/10.png">
    <img id="frame" src="../assets/cadre.png">
  </a-assets>

  <a-camera position="0 0 10"></a-camera>

  <xrextras-named-image-target name="my-poster">

    <a-entity id="cardRow">

      <!-- 第一排 -->
      <a-image src="#card1" position="0 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card2" position="1.2 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card3" position="2.4 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card4" position="3.6 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card5" position="4.8 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card6" position="6 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card7" position="7.2 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card8" position="8.4 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card9" position="9.6 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card10" position="10.8 0 0" width="1.2" height="1.5"></a-image>

      <!-- 第二排 -->
      <a-image src="#card1" position="12 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card2" position="13.2 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card3" position="14.4 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card4" position="15.6 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card5" position="16.8 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card6" position="18 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card7" position="19.2 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card8" position="20.4 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card9" position="21.6 0 0" width="1.2" height="1.5"></a-image>
      <a-image src="#card10" position="22.8 0 0" width="1.2" height="1.5"></a-image>

    </a-entity>

    <a-image
      src="#frame"
      position="0 0 0.2"
      width="1.34"
      height="1.76">
    </a-image>

  </xrextras-named-image-target>

</a-scene>

<script>
let stopped = false;

const cardWidth = 1.2;
const row = document.querySelector("#cardRow");

// 状态
let currentX = 0;
let velocity = -0.035;

// snap状态
let snapping = false;
let snapFrom = 0;
let snapTo = 0;
let snapStart = 0;
const snapDuration = 700;

function loop(t) {

  // 🎢 正常滚动
  if (!stopped) {
    currentX += velocity;
  }

  // 🪶 点击后减速（关键修复：线性减速）
  if (stopped && !snapping) {

    // 平滑减速（不会跳）
    velocity += 0.0006; // 因为是负方向速度

    currentX += velocity;

    // 👉 稳定进入 snap（不会再“突然触发”）
    if (velocity >= 0) {
      velocity = 0;

      snapping = true;

      snapFrom = currentX;
      snapTo = Math.round(currentX / cardWidth) * cardWidth;
      snapStart = t;
    }
  }

  // 🧲 平滑吸附（连续插值）
  if (snapping) {
    let p = (t - snapStart) / snapDuration;
    if (p > 1) p = 1;

    const ease = 1 - Math.pow(1 - p, 3);

    currentX = snapFrom + (snapTo - snapFrom) * ease;

    if (p === 1) {
      snapping = false;
    }
  }

  row.setAttribute("position", `${currentX} 0 0`);

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

window.addEventListener("click", () => {
  if (stopped) return;
  stopped = true;
});
</script>

</body>
</html>
